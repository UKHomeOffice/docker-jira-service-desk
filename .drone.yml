---
kind: pipeline
name: default
type: kubernetes

platform:
  os: linux
  arch: amd64

steps:
- name: build-image
  image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/dind
  commands:
  # wait for docker service to be up before running docker build
  - n=0; while [ "$n" -lt 60 ] && [ ! $(docker stats --no-stream) ]; do n=$(( n + 1 )); sleep 1; done
  - if [ "$${DRONE_BRANCH}" = "mysql8-test" ]; then docker build -f test/Dockerfile.jdbc8 -t quay.io/ukhomeofficedigital/jira-service-desk:$${DRONE_COMMIT_SHA} .; elif [ "$${DRONE_BRANCH}" = "jira-upgrade-test" ]; then docker build -f test/Dockerfile.jira912 -t quay.io/ukhomeofficedigital/jira-service-desk:$${DRONE_COMMIT_SHA} .; else docker build -t quay.io/ukhomeofficedigital/jira-service-desk:$${DRONE_COMMIT_SHA} .; fi
  when:
    event: push

- name: scan-image
  pull: always
  image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/trivy/client:latest
  resources:
    limits:
      cpu: 1000
      memory: 1024Mi
  environment:
    IMAGE_NAME: quay.io/ukhomeofficedigital/jira-service-desk:${DRONE_COMMIT_SHA}
    IGNORE_UNFIXED: "true"
    FAIL_ON_DETECTION: "false"
  depends_on:
    - build-image
  when:
    event:
    - push
    branch:
      exclude:
      - mysql8-test
      - jira-upgrade-test

- name: scan-diagnostic-test-image
  pull: always
  image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/trivy/client:latest
  resources:
    limits:
      cpu: 1000
      memory: 1024Mi
  environment:
    IMAGE_NAME: quay.io/ukhomeofficedigital/jira-service-desk:${DRONE_COMMIT_SHA}
    IGNORE_UNFIXED: "true"
    FAIL_ON_DETECTION: "false"
    FAIL_ON_EOL_OS_DETECTION: "false"
  depends_on:
    - build-image
  when:
    event:
    - push
    branch:
      include:
      - mysql8-test
      - jira-upgrade-test

- name: publish-tag
  image: plugins/docker
  settings:
    registry: quay.io
    repo: quay.io/ukhomeofficedigital/jira-service-desk
    tags: ${DRONE_TAG}
  environment:
    DOCKER_USERNAME: ukhomeofficedigital+jsd
    DOCKER_PASSWORD:
      from_secret: DOCKER_PASSWORD
  when:
    event:
    - tag
    ref:
      exclude:
      - refs/tags/v4.22.2-jdbc8-test-*
      - refs/tags/v5.12.0-jira912-test-*
      - refs/tags/v10.3.27-jira-test-*

- name: publish-jdbc-test-tag
  image: plugins/docker
  settings:
    registry: quay.io
    repo: quay.io/ukhomeofficedigital/jira-service-desk
    dockerfile: test/Dockerfile.jdbc8
    tags: ${DRONE_TAG}
  environment:
    DOCKER_USERNAME: ukhomeofficedigital+jsd
    DOCKER_PASSWORD:
      from_secret: DOCKER_PASSWORD
  when:
    event:
    - tag
    ref:
      include:
      - refs/tags/v4.22.2-jdbc8-test-*

- name: publish-jira-upgrade-test-tag
  image: plugins/docker
  settings:
    registry: quay.io
    repo: quay.io/ukhomeofficedigital/jira-service-desk
    dockerfile: test/Dockerfile.jira912
    tags: ${DRONE_TAG}
  environment:
    DOCKER_USERNAME: ukhomeofficedigital+jsd
    DOCKER_PASSWORD:
      from_secret: DOCKER_PASSWORD
  when:
    event:
    - tag
    ref:
      include:
      - refs/tags/v10.3.27-jira-test-*

services:
- name: docker
  image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/dind

- name: anchore-submission-server
  image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/anchore-submission:latest
  pull: always
  commands:
    - /run.sh server